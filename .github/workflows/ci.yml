name: MarketForge CI

permissions:
  contents: read

concurrency:
  group: marketforge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint application source
        run: npm run lint
      - name: Test execution rules
        run: npm test
      - name: Check patch hygiene
        run: git diff --check
      - name: Build Sites target
        run: npm run build
      - name: Build Vercel target
        run: NITRO_PRESET=vercel npm run build:vercel
      - name: Build Nitro target
        run: NITRO_PRESET=node npm run build:render
