services:
  - type: web
    name: marketforge-execution-lab
    runtime: node
    plan: free
    buildCommand: npm ci && NITRO_PRESET=node npm run build:render
    startCommand: npm run start:render
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NITRO_PRESET
        value: node
